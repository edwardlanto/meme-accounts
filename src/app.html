<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="Meme Accounts — Create and schedule meme posts, carousels, and reels with templates built for Instagram page creators." />
		<link rel="icon" href="/logo/favicon/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/logo/favicon/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/logo/favicon/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/logo/favicon/android-chrome-192x192.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="/logo/favicon/android-chrome-512x512.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Bebas+Neue&display=swap"
			rel="stylesheet"
		/>
		<!-- Font names: src/lib/fonts/brand-fonts.ts · CSS tokens: src/app.css --font-*-name -->
		<script>
			(function () {
				try {
					document.documentElement.dataset.theme = 'light';
					localStorage.setItem('theme', 'light');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

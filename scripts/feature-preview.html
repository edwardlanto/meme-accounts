<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Feature card preview</title>
	<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@500;700&display=swap" rel="stylesheet" />
	<style>
		html, body { margin: 0; background: #111; }
		#card {
			width: 540px; height: 675px; background: #000; border-radius: 24px; overflow: hidden;
			box-sizing: border-box; padding: 36px 32px 20px; font-family: Plus Jakarta Sans, system-ui, sans-serif; color: #fff;
			display: flex; flex-direction: column; gap: 14px;
		}
		h1 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.2; letter-spacing: -0.03em; }
		.hl { color: #2EE6C5; }
		p { margin: 0; font-size: 16px; font-weight: 500; line-height: 1.4; color: rgba(255,255,255,0.92); letter-spacing: -0.015em; }
		.media {
			margin-top: auto; height: 280px; border-radius: 18px; overflow: hidden; background: #1a1a1a;
			display: grid; place-items: center; color: rgba(255,255,255,0.35); font-size: 13px;
			box-shadow: 0 12px 28px rgba(0,0,0,0.45);
			background-image: linear-gradient(135deg, #122 0%, #0a2a28 40%, #111 100%);
		}
	</style>
</head>
<body>
	<div id="card">
		<h1>Notion AI just turned your wiki into a <span class="hl">second brain</span> that actually answers</h1>
		<p>Ask it anything across pages, databases, and meeting notes. <span class="hl">One workspace</span>. Zero tab archaeology. The update teams were waiting for finally shipped.</p>
		<div class="media">Feature cover</div>
	</div>
</body>
</html>

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Meme Accounts — Create and schedule meme posts, carousels, and reels with templates built for Instagram page creators." />
		<link rel="icon" href="/logo/meme-accounts-logo.webp" type="image/webp" />
		<link rel="apple-touch-icon" href="/logo/meme-accounts-logo.webp" />
		<script>
			(function () {
				try {
					var saved = localStorage.getItem('theme');
					var t = saved === 'dark' ? 'dark' : 'light';
					document.documentElement.dataset.theme = t;
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
